name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Generate Prisma client
        run: npm run -w server prisma:generate

      - name: Build server
        run: npm run -w server build

      # `next build` is intentionally not run here yet: it fails on
      # pre-existing @typescript-eslint/no-explicit-any lint errors
      # (see "Known issues" in README.md). Type-check the client instead.
      - name: Type-check client
        run: npx tsc --noEmit -p .
        working-directory: client
